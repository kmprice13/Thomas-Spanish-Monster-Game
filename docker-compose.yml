services:
  islamonstruo:
    build: .
    container_name: islamonstruo
    restart: unless-stopped
    # Default: publish a host port and point Caddy's reverse_proxy at
    # 127.0.0.1:8091. If Caddy runs in Docker on a shared network instead,
    # delete the "ports" block below, uncomment the "networks" sections,
    # set NETWORK_NAME to Caddy's actual network, and point Caddy at
    # islamonstruo:80 instead of a host port.
    ports:
      - "127.0.0.1:8091:80"
    # networks:
    #   - caddy_net

# networks:
#   caddy_net:
#     external: true
#     name: NETWORK_NAME
