name: docker

# Deploys are release-gated: pushing to main builds nothing. Publishing a
# GitHub Release moves :latest, and wagyu's autodeploy poller (homelab repo,
# systemd/islamonstruo) redeploys within ~2 minutes.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kmprice13/thomas-spanish-monster-game:latest
            ghcr.io/kmprice13/thomas-spanish-monster-game:${{ github.event.release.tag_name || github.sha }}
