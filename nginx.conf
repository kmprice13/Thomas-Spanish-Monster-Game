server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell must revalidate on every load: with no Cache-Control,
    # browsers heuristically cache it and a redeploy that renames the hashed
    # bundle leaves stale clients requesting a deleted file (blank page).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Only the hashed bundles are immutable. Vite copies public/assets/* (unhashed
    # PNGs) into dist/assets/ alongside them, so a bare /assets/ prefix here would
    # freeze art updates in browser caches for a year.
    location ~* ^/assets/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
